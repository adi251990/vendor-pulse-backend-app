server:
  port: 8080

spring:
  application:
    name: hireme-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hireme}
    username: ${DB_USER:hireme}
    password: ${DB_PASSWORD:hireme}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: hireme-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.hireme.platform.*"
        spring.json.value.default.type: java.util.Map
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

hireme:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-only-secret-must-be-at-least-32-bytes-long}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  matching:
    weights:
      proximity: 0.35
      rating: 0.25
      skill: 0.25
      reliability: 0.15
    default-radius-km: 25
  pricing:
    overtime-multiplier: 1.5
    holiday-multiplier: 2.0
    daily-overtime-threshold-hours: 8
    weekly-overtime-threshold-hours: 40
  geofence:
    accuracy-buffer-m: 50
    offline-sync-grace-hours: 4
    selfie-verification-threshold: 0.80
    device-shared-secret: ${DEVICE_SHARED_SECRET:dev-only-shared-device-secret-change-me}
  noshow:
    grace-minutes: 15
    sweep-cron: "0 * * * * *"

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:ACplaceholder}
  auth-token: ${TWILIO_AUTH_TOKEN:placeholder}
  from-number: ${TWILIO_FROM_NUMBER:+15555550100}

springdoc:
  swagger-ui:
    path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
