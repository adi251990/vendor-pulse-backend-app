name: Build and publish Docker image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build JAR
        run: mvn -B -DskipTests package

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/vendor-pulse-backend-app:latest
            ghcr.io/${{ github.repository_owner }}/vendor-pulse-backend-app:${{ github.sha }}

      - name: Image pushed
        run: echo "Docker image built and pushed"
